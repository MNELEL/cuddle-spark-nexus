name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rejects unsigned / unverified commits so release artifacts always trace
  # back to a verified identity (required for SLSA-style provenance to mean anything).
  verify-signatures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify commit signatures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before || github.sha }}..${{ github.sha }}"
          fi
          COMMITS=$(git rev-list "$RANGE" 2>/dev/null || git rev-list -1 "${{ github.sha }}")
          FAILED=0
          for sha in $COMMITS; do
            VERIFIED=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.verified')
            REASON=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.reason')
            if [ "$VERIFIED" = "true" ]; then
              echo "signed   $sha"
            else
              echo "UNSIGNED $sha ($REASON)"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::One or more commits are not signed/verified. Enable commit signing (git config commit.gpgsign true, or use SSH/gitsign keys)."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Guards the automated dependency-update flow: Dependabot bumps
      # package.json, and the sync workflow must land a matching text bun.lock.
      - name: Check lockfile is text and in sync
        run: |
          set -euo pipefail
          if [ -f bun.lockb ]; then
            echo "::error::bun.lockb found. Commit the text lockfile bun.lock instead (bun install --save-text-lockfile)."
            exit 1
          fi
          if [ ! -f bun.lock ]; then
            echo "::error::bun.lock missing."
            exit 1
          fi
          if ! git diff --quiet -- bun.lock; then
            echo "::error::bun.lock is out of sync with package.json. Run 'bun install --save-text-lockfile' and commit."
            git diff --stat -- bun.lock
            exit 1
          fi

      # Fails if @tanstack/react-start drifts ahead of react-router / router-core,
      # which historically produced cryptic build errors such as
      # `"getScriptPreloadAttrs" is not exported by "@tanstack/router-core"`.
      - name: Check TanStack version alignment
        run: bun run check:tanstack

      # Navigation + SEO metadata guards (orphan routes, title/description drift).
      - name: Check route-link coverage
        run: bun run check:routes

      - name: Check SEO metadata
        run: bun run check:seo

      - name: Check SEO URLs (canonical, og:url, sitemap, robots)
        run: bun run check:seo:urls

      # Type-safety net: TanStack drift often surfaces first as type errors.
      - name: Typecheck
        run: bunx tsgo --noEmit

      # RLS + rollover coverage. Skips DB-backed suites when the secrets are absent.
      - name: Run tests
        run: bun run test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Production build
        run: bun run build

      # Component/version inventory for every build, kept as a downloadable artifact
      # so we can diff dependency drift over time.
      - name: Generate SBOM (CycloneDX + SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx-${{ github.sha }}.json
          output-file: sbom/sbom-cyclonedx.json

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-spdx-${{ github.sha }}.json
          output-file: sbom/sbom-spdx.json

      - name: Upload SBOM bundle
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90

  # Recipient filtering on class notifications is a privacy boundary: a teacher must
  # never load another user's notifications. The full suite in `build` skips DB-backed
  # tests when credentials are absent, which would go green on a broken filter — this
  # job fails instead of skipping, so every PR really exercises the boundary.
  notifications-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require database credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          MISSING=""
          for var in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!var:-}" ]; then MISSING="$MISSING $var"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secrets:$MISSING. The notification recipient-filtering tests cannot run, so this guard fails instead of skipping them."
            exit 1
          fi
          echo "All database credentials present."

      - name: Run notification recipient-filtering tests
        run: bun run test:notifications --reporter=json --outputFile=notifications-report.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Assert tests actually ran
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("notifications-report.json", "utf8"));
            const tests = (report.testResults ?? []).flatMap((f) => f.assertionResults ?? []);
            const passed = tests.filter((t) => t.status === "passed").length;
            const skipped = tests.filter((t) => t.status === "pending" || t.status === "skipped").length;
            console.log(`passed=${passed} skipped=${skipped} total=${tests.length}`);
            if (passed === 0) {
              console.error("::error::No notification tests ran — the recipient-filtering guard was not exercised.");
              process.exit(1);
            }
            if (skipped > 0) {
              console.error(`::error::${skipped} notification test(s) were skipped. The recipient-filtering guard must run every case.`);
              process.exit(1);
            }
          '

      - name: Upload notification test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-report-${{ github.sha }}
          path: notifications-report.json
          retention-days: 30
  # `student_profiles` holds the most sensitive rows in the product (diagnoses,
  # family situation, incidents). Its RLS contract — anon never, owner full,
  # unrelated teacher never, institution admin read-only — must be exercised on
  # every PR, so this job REQUIRES credentials and fails rather than skipping.
  # It also re-runs the grant/RLS audit against the live database.
  student-profiles-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require database credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          MISSING=""
          for var in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!var:-}" ]; then MISSING="$MISSING $var"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secrets:$MISSING. The student_profiles RLS tests cannot run, so this guard fails instead of skipping them."
            exit 1
          fi
          echo "All database credentials present."

      - name: Run student_profiles RLS tests
        run: bun run test:student-profiles --reporter=json --outputFile=student-profiles-report.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Assert tests actually ran
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("student-profiles-report.json", "utf8"));
            const tests = (report.testResults ?? []).flatMap((f) => f.assertionResults ?? []);
            const passed = tests.filter((t) => t.status === "passed").length;
            const skipped = tests.filter((t) => t.status === "pending" || t.status === "skipped").length;
            console.log(`passed=${passed} skipped=${skipped} total=${tests.length}`);
            if (passed === 0) {
              console.error("::error::No student_profiles tests ran — the sensitive-data boundary was not exercised.");
              process.exit(1);
            }
            if (skipped > 0) {
              console.error(`::error::${skipped} student_profiles test(s) were skipped. Every case must run.`);
              process.exit(1);
            }
          '

      # Anon grants / missing RLS / policyless tables, against the live database.
      - name: Grant and RLS audit
        run: bun run check:grants
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Upload student_profiles test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-profiles-report-${{ github.sha }}
          path: student-profiles-report.json
          retention-days: 30
