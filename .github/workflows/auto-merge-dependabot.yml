name: Auto-merge Dependabot security PRs

on:
  pull_request:
    types: [opened, synchronize, labeled, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.action != 'closed'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for non-breaking security updates
        if: |
          steps.metadata.outputs.alert-state == 'OPEN' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "Dependabot security update detected: ${UPDATE_TYPE}"
          gh pr merge --auto --squash "$PR_URL"

  comment-merged:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Post auto-merge comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHECKS=$(gh api repos/${{ github.repository }}/commits/${MERGE_COMMIT_SHA}/check-runs \
            --jq '.check_runs | map(select(.conclusion == "success")) | map(.name) | join(", ")')
          if [ -z "$CHECKS" ]; then CHECKS="No check runs reported"; fi
          gh pr comment "$PR_URL" --body "✅ Auto-merged Dependabot security update. Commit SHA: ${MERGE_COMMIT_SHA}. Checks passed: ${CHECKS}."
